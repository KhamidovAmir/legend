apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: debezium-heartbeat.resolution-cdc
  labels:
    strimzi.io/cluster: demp-kafka
spec:
  topicName: __debezium-heartbeat.resolution-cdc
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: 2          # with acks=all: a write survives the loss of one broker
    retention.ms: 86400000
    cleanup.policy: delete
