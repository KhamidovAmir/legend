# Kafka topics as code (Strimzi KafkaTopic). Applied by the platform pipeline; auto-creation is disabled on the brokers.
# Partitions: ordering is per key (exceptionId), so the partition count only limits consumer parallelism.
# Changing the partition count of a keyed topic breaks per-key ordering for in-flight data - plan it as a migration.
---
# owner: delivery-team; consumers: exception-service
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: external.delivery.events
  labels:
    strimzi.io/cluster: demp-kafka
spec:
  topicName: external.delivery.events
  partitions: 12
  replicas: 3
  config:
    min.insync.replicas: 2          # with acks=all: a write survives the loss of one broker
    retention.ms: 604800000
    cleanup.policy: delete
---
# dead letters of external.delivery.events (kept longer: they are analysed by people)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: external.delivery.events.dlt
  labels:
    strimzi.io/cluster: demp-kafka
spec:
  topicName: external.delivery.events.dlt
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2          # with acks=all: a write survives the loss of one broker
    retention.ms: 2419200000
    cleanup.policy: delete
---
