global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Services are reached through the ports published on the host. This works for both ways of running them:
  # from the IDE ("make run-...") and in containers ("make up-apps" publishes the same ports).
  - job_name: demp-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081   # exception-service
          - host.docker.internal:8082   # resolution-service
          - host.docker.internal:8083   # integration-service
          - host.docker.internal:8084   # analytics-service

  # replication slot lag, WAL size
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # consumer group lag
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
