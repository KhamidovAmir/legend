apiVersion: v1
kind: Service
metadata:
  name: {{ include "demp.name" . }}
  labels: {{- include "demp.labels" . | nindent 4 }}
spec:
  selector: {{- include "demp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "demp.name" . }}
  labels: {{- include "demp.labels" . | nindent 4 }}
automountServiceAccountToken: false
