apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demp.name" . }}
  labels: {{- include "demp.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.containerPort | quote }}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
