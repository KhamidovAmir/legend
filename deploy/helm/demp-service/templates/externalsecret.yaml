{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "demp.name" . }}
  labels: {{- include "demp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.vault.secretStore }}
  target:
    name: {{ include "demp.name" . }}
  data:
    {{- range $envName, $property := .Values.vault.keys }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ required "vault.path is required when vault.enabled=true" $.Values.vault.path }}
        property: {{ $property }}
    {{- end }}
{{- end }}
