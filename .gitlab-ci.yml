# GitLab CI pipeline (self-hosted GitLab). Mirrors .github/workflows: see docs/ci-cd.md.
#
#   MR                -> validate, test, quality            (must be green to merge: + Sonar gate + 1 approval)
#   merge to master   -> + package, scan, deploy-dev (auto), deploy-test (button)
#   tag vX.Y.Z        -> + deploy-preprod (auto), deploy-prod (button, team lead only via protected environment)
#
# Required CI/CD variables (Settings -> CI/CD -> Variables or Vault): SONAR_HOST_URL, SONAR_TOKEN,
# KUBE_CONTEXT_<ENV> are provided by the GitLab agent for Kubernetes.

stages: [validate, test, quality, package, scan, deploy-dev, deploy-test, deploy-preprod, deploy-prod]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

variables:
  MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  MAVEN_ARGS: -B -ntp
  # release pipelines use the tag as the version; everything else is identified by the commit
  VERSION: $CI_COMMIT_SHORT_SHA
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  SERVICES: exception-service resolution-service integration-service analytics-service

.release-version: &release-version
  - if [ -n "$CI_COMMIT_TAG" ]; then export VERSION="${CI_COMMIT_TAG#v}"; fi

.maven:
  image: maven:3.9-eclipse-temurin-21
  cache:
    key:
      files: [pom.xml]
    paths: [.m2/repository]

# ---------------------------------------------------------------- validate
manifests:
  stage: validate
  image: alpine/helm:3.16.4
  before_script:
    - apk add --no-cache bash python3 py3-yaml
  script:
    - python3 scripts/render-rules.py --check
    - python3 scripts/render-connector.py
    - bash scripts/helm-check.sh lint

prometheus-rules:
  stage: validate
  image:
    name: prom/prometheus:v2.55.1
    entrypoint: [""]
  script:
    - promtool check rules deploy/observability/alerts.yml

# ---------------------------------------------------------------- test
# Unit (*Test) + integration (*IT). Integration tests start PostgreSQL and Kafka with Testcontainers,
# so the job needs a Docker daemon: docker-in-docker service (the runner must allow privileged mode).
test:
  stage: test
  extends: .maven
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # containers are started inside dind: tests must connect to that host, not to localhost
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - *release-version
    - mvn $MAVEN_ARGS verify -Drevision=$( [ -n "$CI_COMMIT_TAG" ] && echo "$VERSION" || echo "0.0.1-SNAPSHOT" )
    - python3 scripts/coverage-summary.py || true
  coverage: '/TOTAL line coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
        - "**/target/failsafe-reports/TEST-*.xml"
    paths:
      - "services/*/target/*-service.jar"
      - "**/target/site/jacoco/"
      - "**/target/jacoco.exec"
      - "**/target/classes/"

# ---------------------------------------------------------------- quality
# JaCoCo -> SonarQube. Quality gate (configured in Sonar): coverage on NEW code >= 70%, no new blocker issues.
sonarqube:
  stage: quality
  extends: .maven
  needs: [test]
  variables:
    GIT_DEPTH: "0"
  script:
    - mvn $MAVEN_ARGS org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true
  rules:
    - if: $SONAR_HOST_URL

# ---------------------------------------------------------------- package
.image:
  stage: package
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: [test]
  before_script:
    - *release-version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --build-arg SERVICE=$SERVICE --build-arg VERSION=$VERSION --build-arg REVISION=$CI_COMMIT_SHA
        -t "$IMAGE_PREFIX/$SERVICE:$VERSION" .
    - docker push "$IMAGE_PREFIX/$SERVICE:$VERSION"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

image:
  extends: .image
  parallel:
    matrix:
      - SERVICE: [exception-service, resolution-service, integration-service, analytics-service]

# ---------------------------------------------------------------- scan
trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.57.0
    entrypoint: [""]
  needs: [image]
  parallel:
    matrix:
      - SERVICE: [exception-service, resolution-service, integration-service, analytics-service]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - *release-version
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_PREFIX/$SERVICE:$VERSION"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------- deploy
# One job per environment. Each does "helm upgrade" with the values file of that environment;
# secrets are NOT passed through CI: pods get them from Vault (External Secrets Operator).
.deploy:
  image: alpine/k8s:1.31.2            # kubectl + helm
  before_script:
    - *release-version
    - kubectl config use-context "$KUBE_CONTEXT"
  script:
    - kubectl apply -n "demp-$ENV" -f deploy/platform/kafka-topics.yaml -f deploy/platform/prometheus-rule.yaml
    - bash scripts/deploy.sh "$ENV" "$VERSION" "$IMAGE_PREFIX"
    # connector config lives in the service repository; the table it reads is created by the service's migration
    - kubectl apply -n "demp-$ENV" -f deploy/platform/debezium-connector.yaml
  environment:
    name: $ENV
    url: https://demp-$ENV.example.com
  resource_group: deploy-$ENV          # one rollout per stand at a time

deploy-dev:                            # automatically after every merge to master
  extends: .deploy
  stage: deploy-dev
  variables: { ENV: dev, KUBE_CONTEXT: "$CI_PROJECT_PATH:dev" }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-test:                           # a button: QA decides when the stand gets a new version
  extends: .deploy
  stage: deploy-test
  variables: { ENV: test, KUBE_CONTEXT: "$CI_PROJECT_PATH:test" }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true              # the pipeline is not "blocked" while nobody pressed the button

deploy-preprod:                        # release tag -> preprod
  extends: .deploy
  stage: deploy-preprod
  variables: { ENV: preprod, KUBE_CONTEXT: "$CI_PROJECT_PATH:preprod" }
  rules:
    - if: $CI_COMMIT_TAG

deploy-prod:                           # the same images as preprod; the "prod" environment is protected: only the lead may run it
  extends: .deploy
  stage: deploy-prod
  variables: { ENV: prod, KUBE_CONTEXT: "$CI_PROJECT_PATH:prod" }
  needs: [deploy-preprod]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

# Rollback of one service to the previous Helm release:  run pipeline with ROLLBACK_ENV=prod ROLLBACK_SERVICE=resolution-service
rollback:
  stage: deploy-prod
  image: alpine/k8s:1.31.2
  script:
    - kubectl config use-context "$CI_PROJECT_PATH:$ROLLBACK_ENV"
    - helm rollback "$ROLLBACK_SERVICE" --namespace "demp-$ROLLBACK_ENV" --wait
  rules:
    - if: $ROLLBACK_ENV && $ROLLBACK_SERVICE
      when: manual
  environment:
    name: $ROLLBACK_ENV
