spring:
  application:
    name: resolution-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resolution_db}
    username: ${DB_USERNAME:resolution}
    password: ${DB_PASSWORD:resolution}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Liquibase; Hibernate only verifies the mapping
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: resolution-service
      auto-offset-reset: earliest
      properties:
        max.poll.interval.ms: 300000
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
    listener:
      ack-mode: record
      observation-enabled: true
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    template:
      observation-enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

# No polling relay here: the outbox table is append-only and is shipped to Kafka by Debezium (CDC).
# See deploy/debezium/resolution-outbox-connector.json
platform:
  outbox:
    polling:
      enabled: false

resolution:
  outbox:
    # must not be shorter than the re-publication window after a replication slot loss
    retention: 7d
  reconciliation:
    poll-interval: 1s
    batch-size: 50
  sla:
    poll-interval: 5s
  verification:
    max-query-failures: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
