# exception-service @ dev
replicaCount: 1
env:
  DB_URL: jdbc:postgresql://pg-dev.example.com:5432/exception_db
  KAFKA_BOOTSTRAP_SERVERS: kafka-dev-bootstrap.kafka:9092
  TRACING_SAMPLING_PROBABILITY: "1.0"
vault:
  path: demp/dev/exception-service
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { memory: 512Mi }
podDisruptionBudget:
  enabled: false
ingress:
  enabled: true
  host: demp-dev.example.com
  tlsSecret: demp-dev-tls
