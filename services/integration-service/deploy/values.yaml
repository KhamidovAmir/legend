# integration-service: values common to all environments (chart: deploy/helm/demp-service)
nameOverride: integration-service
image:
  repository: registry.example.com/demp/integration-service
env:
  OTLP_TRACING_ENDPOINT: http://otel-collector.monitoring:4318/v1/traces
  # commands and queries have separate consumer pools
  INTEGRATION_COMMANDS_CONCURRENCY: "4"
  INTEGRATION_QUERIES_CONCURRENCY: "2"
