# integration-service @ preprod
replicaCount: 2
env:
  DB_URL: jdbc:postgresql://pg-preprod.example.com:5432/integration_db
  KAFKA_BOOTSTRAP_SERVERS: kafka-preprod-bootstrap.kafka:9092
  TRACING_SAMPLING_PROBABILITY: "0.1"
  DELIVERY_BASE_URL: http://delivery-api.preprod.example.com
vault:
  path: demp/preprod/integration-service
resources:
  requests: { cpu: 200m, memory: 768Mi }
  limits: { memory: 768Mi }
podDisruptionBudget:
  enabled: true
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
