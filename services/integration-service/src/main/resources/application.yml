spring:
  application:
    name: integration-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integration_db}
    username: ${DB_USERNAME:integration}
    password: ${DB_PASSWORD:integration}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Liquibase; Hibernate only verifies the mapping
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: integration-service
      auto-offset-reset: earliest
      properties:
        max.poll.interval.ms: 300000
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
    listener:
      ack-mode: record
      observation-enabled: true
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    template:
      observation-enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

platform:
  outbox:
    polling:
      enabled: true

integration:
  # Separate consumer pools: reconciliation/verification queries must never starve side-effecting commands.
  commands-concurrency: ${INTEGRATION_COMMANDS_CONCURRENCY:4}
  queries-concurrency: ${INTEGRATION_QUERIES_CONCURRENCY:2}
  # IntegrationEndpointPolicy: technical rules per external system
  systems:
    DELIVERY:
      base-url: ${DELIVERY_BASE_URL:http://localhost:8089}
      connect-timeout: 1s
      read-timeout: 3s
      max-command-attempts: 3      # repeated ONLY if the request was certainly not sent
      max-query-attempts: 3        # queries have no side effects: always safe to repeat
      retry-backoff: 200ms
      commands-per-second: 20      # separate shares of the rate limit (local to each replica)
      queries-per-second: 10
      rate-limit-wait: 2s
      circuit-breaker-open-duration: 30s
      circuit-breaker-minimum-calls: 10
      circuit-breaker-failure-rate: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
